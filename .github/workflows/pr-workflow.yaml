name: PR Workflow

on:
  pull_request:

permissions:
  contents: read

jobs:
  jq:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate JSON syntax
        run: |
          shopt -s globstar nullglob
          files=(**/*.json)
          [ ${#files[@]} -gt 0 ] || { echo "No JSON files found"; exit 1; }
          for f in "${files[@]}"; do
            echo "Checking $f"
            jq empty "$f"
          done
